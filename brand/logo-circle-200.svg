<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Docloom">
  <title>Docloom</title>
  <!-- Circular Docloom logo, 200×200. Loom mark: violet warp threads woven
       through light weft lines on a dark disc. Corners are transparent. -->
  <circle cx="100" cy="100" r="100" fill="#09090b" />
  <circle cx="100" cy="100" r="98" fill="none" stroke="#27272a" stroke-width="2" />
  <g transform="translate(100 100) scale(3) translate(-32 -32)">
    <!-- warp over the weft -->
    <g fill="#8b5cf6">
      <rect x="16" y="14" width="6" height="36" />
      <rect x="29" y="14" width="6" height="36" />
      <rect x="42" y="14" width="6" height="36" />
    </g>
    <!-- middle weft line passes over the warp -->
    <rect x="10" y="29" width="44" height="6" fill="#e4e4e7" />
    <!-- outer weft lines pass under, broken at each intersection -->
    <g fill="#e4e4e7">
      <rect x="10" y="18" width="6" height="6" />
      <rect x="22" y="18" width="7" height="6" />
      <rect x="35" y="18" width="7" height="6" />
      <rect x="48" y="18" width="6" height="6" />
      <rect x="10" y="40" width="6" height="6" />
      <rect x="22" y="40" width="7" height="6" />
      <rect x="35" y="40" width="7" height="6" />
      <rect x="48" y="40" width="6" height="6" />
    </g>
  </g>
</svg>
